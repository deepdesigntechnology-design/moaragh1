<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Amiri;
      src: url("./Amiri-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: Amiri;
      src: url("./Amiri-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1792px;
      height: 1008px;
      overflow: hidden;
      background: #F3EAD8;
    }
    .stage {
      position: relative;
      width: 1792px;
      height: 1008px;
      background: #F3EAD8 url("./bg.jpg") center / cover no-repeat;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: 62%;
      text-align: center;
      color: #1F1610;
    }
    h1 {
      font-family: Amiri, serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 1.22;
      margin: 0;
      font-kerning: normal;
    }
    h1 .line2 {
      display: block;
      font-size: 76px;
      margin-top: 0.06em;
    }
    .rule {
      width: 38%;
      height: 2px;
      background: #9A8068;
      margin: 26px auto 20px;
    }
    .sub {
      font-family: Amiri, serif;
      font-weight: 400;
      font-size: 36px;
      color: #6B3F2A;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <h1>جزوه راهبردی<span class="line2">صنعت نوین معرق چرم</span></h1>
      <div class="rule"></div>
      <div class="sub">استاد افشین خلیلی</div>
    </div>
  </div>
</body>
</html>
